name: cross-platform build between Ubuntu and Windows
on:
  push:
    branches:
      - dev
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false

      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release, Debug]
        c_compiler: [clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up python for SPIRV-Tools
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run the Python dependency script in shaderc
        run: python ${{github.workspace}}/extern/shaderc/utils/git-sync-deps

      - name: Install the Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Setup Ninja
        uses: ashutoshvarma/setup-ninja@master
        with:
          version: 1.10.0

      - name: Configure and build CMake with Ninja
        uses: ashutoshvarma/action-cmake-build@master
        with:
          build-dir: ${{ github.workspace }}/build
          cc: ${{ matrix.c_compiler }}
          cxx: ${{ matrix.cpp_compiler }}
          configure-options: -G Ninja
          build-type: ${{ matrix.build_type }}